name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      # Uploads the built dist/ folder as a downloadable artifact on this
      # workflow run — grab it from the Actions run summary page.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchdesk-crm-app-dist
          path: dist/
